<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorfladen – Sortimentsanalyse 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;font-size:14px;background:#f4f5f7;color:#1a1a2e;padding:16px;}
h1{font-size:19px;font-weight:600;margin-bottom:18px;color:#1F4E79;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.card{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.card-label{font-size:11px;color:#777;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.card-value{font-size:21px;font-weight:600;color:#1F4E79;}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.slider-row label{font-size:13px;color:#555;white-space:nowrap;}
.slider-row input[type=range]{flex:1;accent-color:#1F4E79;}
.slider-row span{font-size:14px;font-weight:600;min-width:50px;text-align:right;color:#1F4E79;}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.btns button{font-size:12px;padding:5px 13px;border:1px solid #ccd;border-radius:6px;background:#fff;cursor:pointer;color:#333;transition:background .15s;}
.btns button:hover{background:#e8f0fb;border-color:#1F4E79;color:#1F4E79;}
.panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.09);margin-bottom:16px;}
.panel-title{font-size:13px;font-weight:600;color:#555;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px;}
.chart-wrap{position:relative;width:100%;height:240px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:7px 9px;font-size:12px;font-weight:600;color:#fff;background:#1F4E79;border-bottom:2px solid #163d62;}
th.r{text-align:right;}
td{padding:6px 9px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;}
td.r{text-align:right;}
tr:hover td{background:#f0f5ff;}
.link{cursor:pointer;color:#1565c0;font-weight:600;text-decoration:underline;text-underline-offset:2px;}
.drill-close{font-size:12px;padding:4px 11px;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;}
.hidden{display:none;}

/* ── Suchbereich ── */
.search-wrap{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.search-wrap input{flex:1;padding:9px 13px;border:1px solid #ccd;border-radius:7px;font-size:13px;outline:none;transition:border .15s;}
.search-wrap input:focus{border-color:#1F4E79;box-shadow:0 0 0 2px rgba(31,78,121,.12);}
.search-wrap button{padding:9px 16px;background:#1F4E79;color:#fff;border:none;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap;}
.search-wrap button:hover{background:#163d62;}
.search-results{margin-top:4px;}
.search-hit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:6px;border:1px solid #e0e0e0;background:#fff;}
.search-hit.active{border-color:#1F4E79;background:#e8f0fb;}
.search-hit.inactive{border-color:#e0e0e0;background:#fff7f5;}
.hit-rank{font-size:20px;font-weight:700;min-width:44px;text-align:center;color:#1F4E79;}
.hit-rank.inactive{color:#aaa;}
.hit-info{flex:1;}
.hit-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.hit-meta{font-size:11px;color:#777;}
.hit-umsatz{text-align:right;font-size:13px;font-weight:600;color:#1F4E79;white-space:nowrap;}
.hit-umsatz.inactive{color:#aaa;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-top:4px;}
.badge-yes{background:#d4edda;color:#155724;}
.badge-no{background:#fce8e6;color:#c0392b;}
.no-results{color:#999;font-size:13px;padding:12px 0;}
</style>
</head>

const TA=3849;

function ic(x){x=Math.min(Math.max(x,RC[0].n),RC[RC.length-1].n);for(let i=0;i<RC.length-1;i++){if(x>=RC[i].n&&x<=RC[i+1].n){const t=(x-RC[i].n)/(RC[i+1].n-RC[i].n);return{u:Math.min(RC[i].u+t*(RC[i+1].u-RC[i].u),100),m:RC[i].m+t*(RC[i+1].m-RC[i].m)};}}return{u:100,m:0};}
function cw(n){const top=A.slice(0,Math.min(n,A.length));const wm={},wa={};let cu=0;for(const[wi,uc,nm,ar,rk] of top){if(!wm[wi]){wm[wi]={a:0,u:0};wa[wi]=[];}wm[wi].a++;wm[wi].u+=uc;cu+=uc;wa[wi].push({nm,u:uc,ar,rk});}return{wm,cu,wa};}
let cv=1000,cwa={};

const ch=new Chart(document.getElementById('mc'),{
  type:'line',
  data:{labels:RC.map(s=>s.n),datasets:[{data:RC.map(s=>Math.min(s.u,100)),borderColor:'#1F4E79',backgroundColor:'rgba(31,78,121,0.07)',borderWidth:2.5,pointRadius:0,tension:0.25,fill:true}]},
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>c[0].parsed.x.toLocaleString('de-DE')+' Artikel',label:c=>c.parsed.y.toFixed(1).replace('.',',')+' % Umsatz'}}},
    scales:{
      x:{type:'linear',min:0,max:3000,title:{display:true,text:'Anzahl Artikel',font:{size:12}},ticks:{stepSize:500,autoSkip:false,maxRotation:0,callback:v=>v.toLocaleString('de-DE')}},
      y:{min:50,max:100,title:{display:true,text:'Umsatzabdeckung (%)',font:{size:12}},ticks:{callback:v=>v+' %'}}
    }
  },
  plugins:[{id:'mk',afterDraw(c){
    const{ctx,chartArea,scales}=c;const x=scales.x.getPixelForValue(cv);
    ctx.save();ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.setLineDash([5,3]);
    ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();ctx.restore();
  }}]
});

function sd(wi){
  const arts=cwa[wi]||[];
  document.getElementById('dt').textContent=(WG[wi]||'Sonstige')+' – '+arts.length+' Artikel';
  const tb=document.getElementById('db');tb.innerHTML='';
  arts.sort((a,b)=>a.rk-b.rk);
  arts.forEach((a,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="r" style="color:#aaa;">${i+1}</td><td style="font-size:11px;color:#888;">${a.ar}</td><td>${a.nm}</td><td class="r"><b>${(a.u/100).toFixed(2).replace('.',',')} €</b></td>`;
    tb.appendChild(tr);
  });
  document.getElementById('dd').classList.remove('hidden');
  document.getElementById('dd').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function cd(){document.getElementById('dd').classList.add('hidden');}

// ── SUCHE ──────────────────────────────────────────────────────────────────
function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const div=document.getElementById('searchResults');
  if(q.length<2){div.innerHTML='';return;}
  const hits=A.filter(([wi,uc,nm,ar,rk])=>
    nm.toLowerCase().includes(q)||ar.toLowerCase().includes(q)
  ).slice(0,8);
  if(hits.length===0){div.innerHTML='<div class="no-results">Kein Artikel gefunden.</div>';return;}
  div.innerHTML=hits.map(([wi,uc,nm,ar,rk])=>{
    const inSortiment=rk<=cv;
    const uStr=(uc/100).toFixed(2).replace('.',',');
    const wgName=WG[wi]||'Sonstige';
    return `<div class="search-hit ${inSortiment?'active':'inactive'}">
      <div class="hit-rank ${inSortiment?'':'inactive'}">
        <div>Rang</div><div>${rk.toLocaleString('de-DE')}</div>
      </div>
      <div class="hit-info">
        <div class="hit-name">${nm}</div>
        <div class="hit-meta">EAN/Nr.: ${ar} &nbsp;·&nbsp; ${wgName}</div>
        <span class="badge ${inSortiment?'badge-yes':'badge-no'}">${inSortiment?'✓ Im Sortiment bei '+cv.toLocaleString('de-DE')+' Artikeln':'✗ Entfällt bei '+cv.toLocaleString('de-DE')+' Artikeln'}</span>
      </div>
      <div class="hit-umsatz ${inSortiment?'':'inactive'}">${uStr} €</div>
    </div>`;
  }).join('');
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='';
}

function ud(val){
  cv=val;
  const c=ic(val);
  const{wm,cu,wa}=cw(val);
  cwa=wa;
  document.getElementById('ca').textContent=val.toLocaleString('de-DE');
  document.getElementById('cu').textContent=c.u.toFixed(1).replace('.',',')+' %';
  document.getElementById('ce').textContent=(TA-val).toLocaleString('de-DE');
  document.getElementById('cm').textContent=c.m.toFixed(2).replace('.',',')+' €';
  document.getElementById('so').textContent=val.toLocaleString('de-DE');
  const sr=Object.keys(wm).map(k=>({i:+k,...wm[k]})).sort((a,b)=>b.u-a.u);
  const tb=document.getElementById('wb');tb.innerHTML='';
  for(const w of sr){
    const aa=(w.a/val*100).toFixed(1).replace('.',',');
    const ua=(w.u/cu*100).toFixed(1).replace('.',',');
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${WG[w.i]||'Sonstige'}</td><td class="r"><span class="link" onclick="sd(${w.i})">${w.a.toLocaleString('de-DE')}</span></td><td class="r">${aa} %</td><td class="r">${Math.round(w.u/100).toLocaleString('de-DE')} €</td><td class="r">${ua} %</td>`;
    tb.appendChild(tr);
  }
  cd();
  // Suchergebnisse live aktualisieren wenn Suche aktiv
  if(document.getElementById('searchInput').value.trim().length>=2) doSearch();
  ch.update('none');
}
function sv(v){document.getElementById('sl').value=v;ud(v);}
document.getElementById('sl').addEventListener('input',e=>ud(+e.target.value));
ud(1000);
