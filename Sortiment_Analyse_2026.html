<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,sans-serif;font-size:14px;background:#f5f5f5;color:#222;padding:20px;}
  h1{font-size:20px;font-weight:500;margin-bottom:20px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
  .card{background:#fff;border-radius:8px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .slider-row input{flex:1;}
  .slider-row span{font-size:14px;font-weight:500;min-width:50px;text-align:right;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .btns button{font-size:12px;padding:4px 12px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;}
  .btns button:hover{background:#f0f0f0;}
  .chart-wrap{position:relative;width:100%;height:260px;margin-bottom:24px;background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .section-title{font-size:13px;font-weight:500;color:#555;margin-bottom:8px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  th{text-align:left;padding:8px 10px;font-size:12px;font-weight:500;color:#555;border-bottom:1px solid #e0e0e0;background:#fafafa;}
  th.r,td.r{text-align:right;}
  td{padding:6px 10px;border-bottom:1px solid #f0f0f0;font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .link{cursor:pointer;color:#1565c0;font-weight:500;text-decoration:underline;}
  .drill-section{margin-top:20px;background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .drill-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .drill-title{font-size:14px;font-weight:500;}
  .close-btn{font-size:12px;padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;}
  .artnr{font-size:11px;color:#777;}
  .hidden{display:none;}
</style>

function ic(x){x=Math.min(Math.max(x,RC[0].n),RC[RC.length-1].n);for(let i=0;i<RC.length-1;i++){if(x>=RC[i].n&&x<=RC[i+1].n){const t=(x-RC[i].n)/(RC[i+1].n-RC[i].n);return{u:Math.min(RC[i].u+t*(RC[i+1].u-RC[i].u),100),m:RC[i].m+t*(RC[i+1].m-RC[i].m)};}}return{u:100,m:0};}
function cw(n){const top=A.slice(0,Math.min(n,A.length));const wm={},wa={};let cu=0;for(const[wi,uc,nm,ar] of top){if(!wm[wi]){wm[wi]={a:0,u:0};wa[wi]=[];}wm[wi].a++;wm[wi].u+=uc;cu+=uc;wa[wi].push({nm,u:uc,ar});}return{wm,cu,wa};}
